[project]
name = "shpy"
version = "0.1.0"
description = "A lightweight static shape checker for Numpy arrays."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shpy"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "numpy>=2.5.2",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[project.scripts]
shpy = "shpy.cli:main"
