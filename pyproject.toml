[project]
name = "shpy"
version = "0.2.0"
description = "A lightweight static shape checker for Numpy arrays."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shpy"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "numpy>=2.5.2",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[project.scripts]
shpy = "shpy.cli:main"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   
    "F",   
    "I",   
    "UP",  
    "B",   
    "SIM", 
    "C4",  
    "ANN", 
    "RUF", 
]
ignore = [
    "ANN401", 
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["ANN", "E501"]
"examples/**/*" = ["ANN", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"