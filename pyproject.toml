[project]
name = "shape-checker"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shape_checker"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[project.scripts]
check = "shape_checker.cli:main"
